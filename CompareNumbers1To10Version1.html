<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Compare Numbers: Bigger and Smaller</title>
<style>
/* ── RESET ──────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:#E8F4FD;color:#1A2B3C;min-height:100vh;padding-bottom:48px}
button{font-family:inherit;cursor:pointer}

/* ── APP WRAPPER ─────────────────────────────────────────── */
#app{max-width:820px;margin:0 auto;padding:14px}

/* ── NAV BAR ────────────────────────────────────────────── */
#nav{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0 14px;gap:8px}
.nav-group{display:flex;gap:8px}
.btn-nav{background:#2E86C1;color:#fff;border:none;border-radius:12px;
  padding:11px 18px;font-size:17px;font-weight:700;min-height:50px;
  transition:background .15s;line-height:1}
.btn-nav:hover{background:#2874A6}
.btn-nav:disabled{background:#B3C6D4;cursor:default}
.btn-read{background:#7D3C98}
.btn-read:hover{background:#6C3483}

/* ── PROGRESS ───────────────────────────────────────────── */
#pb-wrap{height:8px;background:#D6EAF8;border-radius:4px;margin-bottom:6px}
#pb{height:8px;background:#2E86C1;border-radius:4px;transition:width .3s}
#sc{text-align:center;font-size:13px;color:#99A3A4;margin-bottom:12px}

/* ── PHASE BADGE ────────────────────────────────────────── */
.badge{display:inline-block;border-radius:20px;padding:5px 18px;
  font-size:15px;font-weight:700;margin-bottom:12px;border:2px solid;letter-spacing:.3px}
.badge-ido{background:#D6EAF8;color:#1A5276;border-color:#2E86C1}
.badge-wedo{background:#D5F5E3;color:#145A32;border-color:#27AE60}
.badge-youdo{background:#FDEBD0;color:#7E5109;border-color:#E67E22}
.badge-check{background:#F4ECF7;color:#6C3483;border-color:#8E44AD}

/* ── CARD ───────────────────────────────────────────────── */
.card{background:#fff;border-radius:22px;padding:26px 22px;
  box-shadow:0 4px 20px rgba(0,0,0,.07);margin-bottom:14px}

/* ── INSTRUCTION ────────────────────────────────────────── */
.instr{font-size:24px;font-weight:800;text-align:center;line-height:1.4;
  margin-bottom:20px;padding:12px 14px;border-radius:14px;cursor:pointer;
  user-select:none;-webkit-user-select:none;transition:background .15s}
.instr:hover{background:#EBF5FB}
.ih{display:block;font-size:13px;font-weight:400;color:#AAB7B8;margin-top:4px}

/* ── GROUP BOXES ────────────────────────────────────────── */
.groups{display:flex;gap:14px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.gbox{flex:1 1 260px;max-width:340px;background:#F4F9FF;border:3px solid #AED6F1;
  border-radius:18px;padding:18px 12px;display:flex;flex-direction:column;
  align-items:center;gap:12px;min-height:160px}

/* ── BALLS ──────────────────────────────────────────────── */
.balls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:300px}
.ball{width:52px;height:52px;border-radius:50%;background:#3498DB;
  border:3px solid #2E86C1;cursor:pointer;transition:transform .12s,background .2s;
  user-select:none;-webkit-user-select:none;display:block;flex-shrink:0}
.ball:active{transform:scale(.88)}
/* Ball states */
.bc{background:#F39C12;border-color:#D68910}          /* counted */
.ia{background:#F39C12;border-color:#D68910;box-shadow:0 0 0 5px #FDEBD0} /* ido active */
.bm{background:#1ABC9C;border-color:#17A589;cursor:default} /* matched */
.be{background:#E74C3C;border-color:#CB4335;cursor:default; /* extra */
  box-shadow:0 0 0 4px #FADBD8}

/* ── NUMERALS ───────────────────────────────────────────── */
.numeral{font-size:70px;font-weight:900;color:#1A2B3C;line-height:1;text-align:center}

/* ── COUNT STATUS ───────────────────────────────────────── */
.cst{font-size:16px;color:#5D6D7E;font-weight:600;text-align:center;min-height:22px}

/* ── COUNT AGAIN ────────────────────────────────────────── */
.btn-ca{background:#EBF5FB;color:#1A5276;border:2px solid #85C1E9;
  border-radius:10px;padding:8px 16px;font-size:15px;font-weight:700}
.btn-ca:hover{background:#D6EAF8}

/* ── NUMERALS-ONLY ROW ──────────────────────────────────── */
.num-row{display:flex;gap:28px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.nbox{flex:1 1 130px;max-width:190px;background:#F4F9FF;border:3px solid #AED6F1;
  border-radius:18px;padding:22px 16px;text-align:center;font-size:96px;
  font-weight:900;color:#1A2B3C;line-height:1}

/* ── SHOW OBJECTS BUTTON ────────────────────────────────── */
.btn-so{display:block;margin:0 auto 14px;background:#17A589;color:#fff;border:none;
  border-radius:14px;padding:13px 26px;font-size:17px;font-weight:700}
.btn-so:hover{background:#148F77}

/* ── SUPPORT PANEL ──────────────────────────────────────── */
.sup-panel{display:none;background:#E8F8F5;border:2px solid #1ABC9C;
  border-radius:18px;padding:16px 12px;margin-bottom:16px}
.spt{text-align:center;font-size:15px;font-weight:700;color:#148F77;margin-bottom:12px}

/* ── ANSWER ZONE ────────────────────────────────────────── */
.ans-zone{background:#F0F3F4;border:2px dashed #AEB6BF;border-radius:18px;
  padding:18px 12px;margin-bottom:14px}
.ans-lbl{font-size:15px;font-weight:700;color:#626567;text-align:center;
  margin-bottom:14px;text-transform:uppercase;letter-spacing:1px}
.ans-btns{display:flex;gap:22px;justify-content:center;margin-bottom:16px}
.btn-ans{width:104px;height:104px;font-size:54px;font-weight:900;
  border:4px solid #BDC3C7;border-radius:18px;background:#fff;color:#1A2B3C;
  transition:border-color .15s,background .15s;display:flex;
  align-items:center;justify-content:center}
.btn-ans:hover{border-color:#2E86C1;background:#EBF5FB}
.btn-ans.sel{border-color:#1A5276;background:#D6EAF8;
  box-shadow:0 0 0 3px #85C1E9}

/* ── CHECK BUTTON ───────────────────────────────────────── */
.btn-chk{display:block;margin:0 auto;background:#27AE60;color:#fff;border:none;
  border-radius:16px;padding:16px 50px;font-size:22px;font-weight:800;
  min-width:180px}
.btn-chk:hover{background:#1E8449}
.btn-chk:disabled{background:#A9DFBF;color:#6C8E6E;cursor:default}

/* ── FEEDBACK ───────────────────────────────────────────── */
.fbk{border-radius:18px;padding:0;font-size:21px;font-weight:700;
  text-align:center;line-height:1.45;overflow:hidden;
  max-height:0;transition:max-height .3s,padding .3s}
.fbk.show{max-height:300px;padding:20px 20px}
.fbk-ok{background:#D5F5E3;color:#145A32;border:3px solid #27AE60}
.fbk-no{background:#FDEDEC;color:#7B241C;border:3px solid #E74C3C}
.btn-next-fb{background:#27AE60;color:#fff;border:none;border-radius:12px;
  padding:12px 30px;font-size:17px;font-weight:700;margin-top:12px}
.btn-next-fb:hover{background:#1E8449}

/* ── I DO: TEACHER BOX ──────────────────────────────────── */
.teacher-box{background:#FEF9E7;border-left:5px solid #F39C12;border-radius:12px;
  padding:13px 16px;margin-bottom:18px}
.tl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:#E67E22;margin-bottom:5px}
#ts{font-size:17px;line-height:1.65;color:#5D4037;font-style:italic;min-height:26px}

/* ── I DO: MATCHING SECTION ─────────────────────────────── */
.match-sec{background:#FDFEFE;border:2px solid #D5D8DC;border-radius:18px;
  padding:16px 12px;margin-bottom:16px}
.mt{text-align:center;font-size:16px;font-weight:700;color:#5D6D7E;margin-bottom:12px}
.pairs{display:flex;flex-direction:column;gap:10px;align-items:center;margin-bottom:12px}
.pair-row{display:flex;align-items:center;gap:14px}
.ml{color:#1ABC9C;font-size:22px;font-weight:700}
.extras-row{display:flex;align-items:center;gap:10px;justify-content:center;
  flex-wrap:wrap;padding-top:10px;border-top:2px dashed #D5D8DC}
.el{font-size:14px;font-weight:700;color:#E74C3C}
.eq-label{text-align:center;font-size:16px;font-weight:700;color:#7D3C98;
  padding-top:10px;border-top:2px dashed #D5D8DC}

/* ── I DO: CAPTION ──────────────────────────────────────── */
.cap{text-align:center;font-size:28px;font-weight:900;padding:16px 18px;
  border-radius:16px;margin-top:14px;display:none}
.cap.vis{display:block}
.cap-bigger{background:#D5F5E3;color:#145A32;border:3px solid #27AE60}
.cap-smaller{background:#D6EAF8;color:#1A5276;border:3px solid #2E86C1}
.cap-equal{background:#F4ECF7;color:#6C3483;border:3px solid #8E44AD}

/* ── REPLAY BUTTON ──────────────────────────────────────── */
.btn-replay{display:block;margin:16px auto 0;background:#E67E22;color:#fff;
  border:none;border-radius:12px;padding:10px 24px;font-size:16px;font-weight:700}
.btn-replay:hover{background:#CA6F1E}

/* ── WELCOME / TRANSITION / END ─────────────────────────── */
.ctr{text-align:center;padding:44px 18px}
.btn-start{background:#2E86C1;color:#fff;border:none;border-radius:18px;
  padding:18px 52px;font-size:24px;font-weight:800;
  box-shadow:0 4px 14px rgba(46,134,193,.35);transition:background .15s}
.btn-start:hover{background:#2874A6}
.btn-restart{background:#2E86C1;color:#fff;border:none;border-radius:16px;
  padding:15px 36px;font-size:20px;font-weight:700}
.btn-restart:hover{background:#2874A6}

/* ── RESPONSIVE ─────────────────────────────────────────── */
@media(max-width:600px){
  .card{padding:18px 13px}
  .instr{font-size:20px}
  .ball{width:44px;height:44px}
  .numeral{font-size:56px}
  .btn-ans{width:88px;height:88px;font-size:46px}
  .nbox{font-size:80px}
  .cap{font-size:22px}
  .btn-chk{font-size:19px;padding:14px 36px}
  .btn-start{font-size:20px;padding:16px 36px}
}
</style>
</head>
<body>
<div id="app">

    <button class="btn-nav" id="btn-back" onclick="navBack()">← Back</button>

══════════════════════════════════════════════════════════ */

  {type:'practice',phase:'You Do',concept:'bigger',
   instr:'Count both groups.\nChoose the BIGGER number.',
   L:7,R:2,objs:true,objBtn:false,side:'left',
   ok:'Yes! 7 is bigger than 2. This group has more.',
   no:'Try again. Count both groups.'},

   cap:'2 is SMALLER.',capCls:'cap-smaller',
   conc:'Two is the SMALLER number. Two has fewer balls.'},

  /* 13 - I Do | Smaller | 7 vs 3 */
  {type:'ido',phase:'I Do',concept:'smaller',L:7,R:3,
   cap:'3 is SMALLER.',capCls:'cap-smaller',

  /* 14 - We Do | Smaller | 6 vs 2 | correct=RIGHT */
  {type:'practice',phase:'We Do',concept:'smaller',

   L:6,R:2,objs:true,objBtn:false,side:'right',

  /* 15 - We Do | Smaller | 3 vs 8 | correct=LEFT */
  {type:'practice',phase:'We Do',concept:'smaller',
   instr:'Count both groups.\nChoose the SMALLER number.',
   L:3,R:8,objs:true,objBtn:false,side:'left',

  /* 16 - We Do | Smaller | 5 vs 1 | correct=RIGHT */
  {type:'practice',phase:'We Do',concept:'smaller',

   L:5,R:1,objs:true,objBtn:false,side:'right',
   ok:'Yes! 1 is smaller than 5. This group has fewer.',

  /* 17 - You Do | Smaller | 4 vs 9 | correct=LEFT */
  {type:'practice',phase:'You Do',concept:'smaller',
   instr:'Count both groups.\nChoose the SMALLER number.',
   L:4,R:9,objs:true,objBtn:false,side:'left',
   ok:'Yes! 4 is smaller than 9. This group has fewer.',
   no:'Try again. Count both groups.'},

  /* 18 - You Do | Smaller | 7 vs 3 | numerals only | correct=RIGHT */
  {type:'practice',phase:'You Do',concept:'smaller',
   instr:'Choose the SMALLER number.',
   L:7,R:3,objs:false,objBtn:true,side:'right',
   ok:'Yes! 3 is smaller than 7.',
   no:'Try again. Tap Show Objects to help.'},

  /* 19 - Transition */
  {type:'transition',emoji:'\uD83C\uDF1F',msg:'Excellent!',
   sub:"Now let\u2019s use bigger AND smaller together."},

  /* 20 - We Do | Mix Bigger | 2 vs 8 | correct=RIGHT */
  {type:'practice',phase:'We Do',concept:'mix',
   instr:'Count both groups.\nChoose the BIGGER number.',
   L:2,R:8,objs:true,objBtn:false,side:'right',

  {type:'transition',emoji:'\u270F\uFE0F',msg:"Let\u2019s check what you know.",sub:''},

  {type:'practice',phase:'Quick Check',concept:'check',

/* ══════════════════════════════════════════════════════════
   2. STATE
══════════════════════════════════════════════════════════ */
let ci=0;           // current screen index
let sel=null;       // 'left'|'right'|null
let lc=[];          // left balls counted[]
let rc=[];          // right balls counted[]
let fbState=null;   // null|'ok'|'no'
let opv=false;      // objects panel visible
let slc=[];         // support left counted[]
let src=[];         // support right counted[]
let idoTok=null;    // cancellation token for I Do animation

function initState(){
  const s=SCREENS[ci];
  sel=null; fbState=null; opv=false;
  lc=s.L?new Array(s.L).fill(false):[];
  rc=s.R?new Array(s.R).fill(false):[];
  slc=s.L?new Array(s.L).fill(false):[];
  src=s.R?new Array(s.R).fill(false):[];
  cancelIDo();
}

/* ══════════════════════════════════════════════════════════
   3. SPEECH
══════════════════════════════════════════════════════════ */
let voice=null;
(function initVoice(){
  if(!window.speechSynthesis) return;
  function load(){
    const vs=window.speechSynthesis.getVoices();
    if(!vs.length) return;
    const pref=['samantha','karen','victoria','moira','zira','allison','ava','fiona',
                'female','google uk english female','microsoft zira'];
    for(const p of pref){
      const v=vs.find(v=>v.lang.startsWith('en')&&v.name.toLowerCase().includes(p));
      if(v){voice=v;return;}
    }
    voice=vs.find(v=>v.lang.startsWith('en-'))||vs.find(v=>v.lang.startsWith('en'))||null;
  }
  window.speechSynthesis.onvoiceschanged=load;
  load();
})();

function speak(txt,rate){
  if(!window.speechSynthesis||!txt) return;
  rate=rate||0.88;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.rate=rate; u.pitch=1.05;
  if(voice) u.voice=voice;
  window.speechSynthesis.speak(u);
}

function sw(txt,rate){ /* speak-and-wait → Promise */
  rate=rate||0.88;
  return new Promise(function(res){
    if(!window.speechSynthesis||!txt){setTimeout(res,350);return;}
    window.speechSynthesis.cancel();
    var done=false;
    var fin=function(){if(!done){done=true;res();}};
    var u=new SpeechSynthesisUtterance(txt);
    u.rate=rate; u.pitch=1.05;
    if(voice) u.voice=voice;
    u.onend=fin; u.onerror=fin;
    window.speechSynthesis.speak(u);
    setTimeout(fin,4000); /* safety fallback */
  });
}

const dl=function(ms){return new Promise(function(r){setTimeout(r,ms);});};

/* ══════════════════════════════════════════════════════════
   4. NAVIGATION
══════════════════════════════════════════════════════════ */
function go(i){
  cancelIDo();
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  ci=Math.max(0,Math.min(SCREENS.length-1,i));
  initState();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function navNext(){go(ci+1);}
function navBack(){go(ci-1);}
function navHome(){go(0);}

function readScreen(){
  const s=SCREENS[ci];
  if(s.type==='ido'){replayIDo();return;}
  if(s.type==='practice') speak(s.instr.replace('\n',' '));
  else if(s.type==='transition') speak(s.msg+' '+s.sub);
  else if(s.type==='welcome') speak('Compare Numbers. Bigger and Smaller.');
  else if(s.type==='end') speak('Well done! You can compare numbers!');
}

/* ══════════════════════════════════════════════════════════
   5. RENDER DISPATCHER
══════════════════════════════════════════════════════════ */
function render(){
  const s=SCREENS[ci];

  /* Nav */
  document.getElementById('btn-back').disabled=(ci===0);
  document.getElementById('btn-next').disabled=(ci===SCREENS.length-1);
  document.getElementById('btn-home').style.display=(ci===0)?'none':'';

  /* Progress */
  document.getElementById('pb').style.width=((ci/(SCREENS.length-1))*100)+'%';
  document.getElementById('sc').textContent=
    (ci>0&&ci<SCREENS.length-1)?('Screen '+ci+' of '+(SCREENS.length-2)):'';

  /* Content */
  const mc=document.getElementById('mc');
  switch(s.type){
    case 'welcome':    mc.innerHTML=rWelcome();          break;
    case 'ido':        mc.innerHTML=rIDo(s); playIDo(s); break;
    case 'transition': mc.innerHTML=rTrans(s);           break;
    case 'practice':   mc.innerHTML=rPractice(s);        break;
    case 'end':        mc.innerHTML=rEnd();              break;
  }
}

/* Badge helper */
function badge(phase){
  const cls=phase==='I Do'?'ido':phase==='We Do'?'wedo':phase==='You Do'?'youdo':'check';
  return '<div class="badge badge-'+cls+'">'+phase+'</div>';
}

/* ══════════════════════════════════════════════════════════
   6. WELCOME
══════════════════════════════════════════════════════════ */
function rWelcome(){
  const cols=['#E74C3C','#E67E22','#F1C40F','#2ECC71','#3498DB','#9B59B6'];
  const balls=cols.map(function(c){
    return '<div style="width:46px;height:46px;border-radius:50%;background:'+c+
           ';border:3px solid rgba(0,0,0,.1);flex-shrink:0"></div>';
  }).join('');
  return '<div class="card"><div class="ctr">'+
    '<div style="display:flex;justify-content:center;gap:10px;margin-bottom:26px">'+balls+'</div>'+
    '<div style="font-size:40px;font-weight:900;color:#1A5276;margin-bottom:8px">Compare Numbers</div>'+
    '<div style="font-size:24px;color:#5D6D7E;font-weight:700;margin-bottom:34px">Bigger and Smaller</div>'+
    '<button class="btn-start" onclick="navNext()">Let\u2019s Start \u2192</button>'+
    '</div></div>';
}

/* ══════════════════════════════════════════════════════════
   7. I DO SCREEN + ANIMATION
══════════════════════════════════════════════════════════ */
function rIDo(s){
  /* Build matching pairs section */
  const min=Math.min(s.L,s.R);
  const extras=Math.abs(s.L-s.R);
  const eq=(s.L===s.R);

  var pairs='';
  for(var i=0;i<min;i++){
    pairs+='<div class="pair-row">'+
      '<div class="ball bm"></div>'+
      '<span class="ml">\u2194</span>'+
      '<div class="ball bm"></div>'+
      '</div>';
  }

  var extrasHTML='';
  if(eq){
    extrasHTML='<div class="eq-label">Every ball has a match! They are EQUAL.</div>';
  } else {
    var eSide=(s.L>s.R)?'Left group':'Right group';
    var eBalls='';
    for(var j=0;j<extras;j++) eBalls+='<div class="ball be"></div>';
    extrasHTML='<div class="extras-row"><span class="el">'+eSide+' has MORE:</span>'+eBalls+'</div>';
  }

  /* Left & right balls (non-interactive) */
  var lb='',rb='';
  for(var a=0;a<s.L;a++) lb+='<div class="ball" id="ilb'+a+'" style="cursor:default"></div>';
  for(var b=0;b<s.R;b++) rb+='<div class="ball" id="irb'+b+'" style="cursor:default"></div>';

  return badge(s.phase)+
  '<div class="card">'+
    '<div class="instr" onclick="speak(\'Watch me count.\')">Watch me count.'+
      '<span class="ih">Tap to hear</span></div>'+
    '<div class="teacher-box"><div class="tl">Teacher says:</div><div id="ts">&nbsp;</div></div>'+
    '<div class="groups">'+
      '<div class="gbox">'+
        '<div class="balls" id="ilba">'+lb+'</div>'+
        '<div class="numeral" id="iln" style="opacity:0">'+s.L+'</div>'+
        '<div class="cst" id="ilc"></div>'+
      '</div>'+
      '<div class="gbox">'+
        '<div class="balls" id="irba">'+rb+'</div>'+
        '<div class="numeral" id="irn" style="opacity:0">'+s.R+'</div>'+
        '<div class="cst" id="irc"></div>'+
      '</div>'+
    '</div>'+
    '<div id="ms" class="match-sec" style="display:none">'+
      '<div class="mt">Matching one to one:</div>'+
      '<div class="pairs">'+pairs+'</div>'+
      extrasHTML+
    '</div>'+
    '<div id="ic" class="cap '+s.capCls+'">'+s.cap+'</div>'+
    '<button class="btn-replay" onclick="replayIDo()">\u25B6 Hear again</button>'+
  '</div>';
}

function cancelIDo(){
  if(idoTok){idoTok.dead=true; idoTok=null;}
}

async function playIDo(s){
  cancelIDo();
  var t={dead:false};
  idoTok=t;
  var chk=function(){return t.dead;};
  var setTS=function(txt){if(!t.dead){var el=document.getElementById('ts');if(el)el.textContent=txt;}};

  await dl(700); if(chk()) return;

  /* Count left group */
  setTS('Watch me count the left group.');
  await sw('Watch me count the left group.'); if(chk()) return;

  for(var i=0;i<s.L;i++){
    if(chk()) return;
    var bl=document.getElementById('ilb'+i);
    if(bl) bl.classList.add('ia');
    var lcEl=document.getElementById('ilc');
    if(lcEl) lcEl.textContent='Counted: '+(i+1);
    setTS(NW[i+1]);
    await sw(NW[i+1],0.85); if(chk()) return;
    await dl(180); if(chk()) return;
  }

  var lnEl=document.getElementById('iln');
  if(lnEl) lnEl.style.opacity='1';
  var ltxt=s.L+' ball'+(s.L!==1?'s':'')+'.';
  setTS(ltxt);
  await sw(ltxt); if(chk()) return;
  await dl(400); if(chk()) return;

  /* Count right group */
  setTS('Now the right group.');
  await sw('Now the right group.'); if(chk()) return;

  for(var j=0;j<s.R;j++){
    if(chk()) return;
    var br=document.getElementById('irb'+j);
    if(br) br.classList.add('ia');
    var rcEl=document.getElementById('irc');
    if(rcEl) rcEl.textContent='Counted: '+(j+1);
    setTS(NW[j+1]);
    await sw(NW[j+1],0.85); if(chk()) return;
    await dl(180); if(chk()) return;
  }

  var rnEl=document.getElementById('irn');
  if(rnEl) rnEl.style.opacity='1';
  var rtxt=s.R+' ball'+(s.R!==1?'s':'')+'.';
  setTS(rtxt);
  await sw(rtxt); if(chk()) return;
  await dl(400); if(chk()) return;

  /* Show matching */
  var msEl=document.getElementById('ms');
  if(msEl) msEl.style.display='block';
  setTS('I match them \u2014 one to one.');
  await sw('I match them \u2014 one to one.'); if(chk()) return;
  await dl(500); if(chk()) return;

  /* Conclusion */
  setTS(s.conc);
  await sw(s.conc,0.82); if(chk()) return;

  /* Show caption */
  var capEl=document.getElementById('ic');
  if(capEl) capEl.classList.add('vis');
}

async function replayIDo(){
  cancelIDo();
  await dl(120);
  var s=SCREENS[ci];
  if(s.type!=='ido') return;

  /* Reset all I Do balls */
  for(var i=0;i<s.L;i++){var b=document.getElementById('ilb'+i);if(b)b.className='ball';}
  for(var j=0;j<s.R;j++){var c=document.getElementById('irb'+j);if(c)c.className='ball';}

  var ln=document.getElementById('iln'),rn=document.getElementById('irn');
  if(ln) ln.style.opacity='0';
  if(rn) rn.style.opacity='0';

  var ms=document.getElementById('ms');  if(ms) ms.style.display='none';
  var ic=document.getElementById('ic');  if(ic) ic.classList.remove('vis');
  var ilc=document.getElementById('ilc');if(ilc) ilc.textContent='';
  var irc=document.getElementById('irc');if(irc) irc.textContent='';
  var ts=document.getElementById('ts');  if(ts) ts.textContent='\u00A0';

  playIDo(s);
}

/* ══════════════════════════════════════════════════════════
   8. PRACTICE SCREEN
══════════════════════════════════════════════════════════ */
function rPractice(s){
  var instrSafe=s.instr.replace(/\n/g,' ');
  var instrDisp=s.instr.replace(/\n/g,'<br>');

  /* Groups or numerals-only */
  var groupsHTML='';
  if(s.objs){
    var lb='',rb='';
    for(var i=0;i<s.L;i++) lb+='<div class="ball" id="plb'+i+'" onclick="tapBall(\'left\','+i+')"></div>';
    for(var j=0;j<s.R;j++) rb+='<div class="ball" id="prb'+j+'" onclick="tapBall(\'right\','+j+')"></div>';
    groupsHTML=
      '<div class="groups">'+
        '<div class="gbox">'+
          '<div class="balls">'+lb+'</div>'+
          '<div class="cst" id="lcs">Tap to count</div>'+
          '<div class="numeral">'+s.L+'</div>'+
          '<button class="btn-ca" onclick="resetGrp(\'left\')">Count again</button>'+
        '</div>'+
        '<div class="gbox">'+
          '<div class="balls">'+rb+'</div>'+
          '<div class="cst" id="rcs">Tap to count</div>'+
          '<div class="numeral">'+s.R+'</div>'+
          '<button class="btn-ca" onclick="resetGrp(\'right\')">Count again</button>'+
        '</div>'+
      '</div>';
  } else {
    groupsHTML=
      '<div class="num-row">'+
        '<div class="nbox">'+s.L+'</div>'+
        '<div class="nbox">'+s.R+'</div>'+
      '</div>';
  }

  /* Support panel (Show Objects button) */
  var supHTML='';
  if(s.objBtn){
    var slb='',srb='';
    for(var a=0;a<s.L;a++) slb+='<div class="ball" id="slb'+a+'" onclick="tapSup(\'left\','+a+')"></div>';
    for(var b=0;b<s.R;b++) srb+='<div class="ball" id="srb'+b+'" onclick="tapSup(\'right\','+b+')"></div>';
    supHTML=
      '<button class="btn-so" id="btn-so" onclick="toggleSup()">\uD83D\uDC40 Show Objects</button>'+
      '<div id="sup-panel" class="sup-panel">'+
        '<div class="spt">Count the objects to help you.</div>'+
        '<div class="groups">'+
          '<div class="gbox">'+
            '<div class="balls">'+slb+'</div>'+
            '<div class="cst" id="slcs">Tap to count</div>'+
            '<div class="numeral">'+s.L+'</div>'+
            '<button class="btn-ca" onclick="resetSup(\'left\')">Count again</button>'+
          '</div>'+
          '<div class="gbox">'+
            '<div class="balls">'+srb+'</div>'+
            '<div class="cst" id="srcs">Tap to count</div>'+
            '<div class="numeral">'+s.R+'</div>'+
            '<button class="btn-ca" onclick="resetSup(\'right\')">Count again</button>'+
          '</div>'+
        '</div>'+
      '</div>';
  }

  return badge(s.phase)+
  '<div class="card">'+
    '<div class="instr" onclick="speak(\''+instrSafe+'\')">'+instrDisp+
      '<span class="ih">Tap to hear</span></div>'+
    groupsHTML+
    supHTML+
    '<div class="ans-zone">'+
      '<div class="ans-lbl">Tap your answer:</div>'+
      '<div class="ans-btns">'+
        '<button class="btn-ans" id="ansl" onclick="selAns(\'left\')">'+s.L+'</button>'+
        '<button class="btn-ans" id="ansr" onclick="selAns(\'right\')">'+s.R+'</button>'+
      '</div>'+
      '<button class="btn-chk" id="btn-chk" onclick="chkAns()" disabled>Check \u2713</button>'+
    '</div>'+
    '<div id="fbk" class="fbk"></div>'+
  '</div>';
}

/* Ball tap — practice */
function tapBall(side,idx){
  var arr=(side==='left')?lc:rc;
  if(arr[idx]) return; /* guard: already counted */
  arr[idx]=true;
  var ball=document.getElementById((side==='left')?'plb'+idx:'prb'+idx);
  if(ball) ball.classList.add('bc');
  var cnt=arr.filter(Boolean).length;
  var el=document.getElementById((side==='left')?'lcs':'rcs');
  if(el) el.textContent='Counted: '+cnt;
  speak(NW[cnt]);
}

/* Ball tap — support panel */
function tapSup(side,idx){
  var arr=(side==='left')?slc:src;
  if(arr[idx]) return;
  arr[idx]=true;
  var ball=document.getElementById((side==='left')?'slb'+idx:'srb'+idx);
  if(ball) ball.classList.add('bc');
  var cnt=arr.filter(Boolean).length;
  var el=document.getElementById((side==='left')?'slcs':'srcs');
  if(el) el.textContent='Counted: '+cnt;
  speak(NW[cnt]);
}

/* Reset practice group */
function resetGrp(side){
  var s=SCREENS[ci];
  var n=(side==='left')?s.L:s.R;
  if(side==='left') lc=new Array(n).fill(false);
  else rc=new Array(n).fill(false);
  for(var i=0;i<n;i++){
    var b=document.getElementById((side==='left')?'plb'+i:'prb'+i);
    if(b) b.classList.remove('bc');
  }
  var el=document.getElementById((side==='left')?'lcs':'rcs');
  if(el) el.textContent='Tap to count';
  speak('Count again.');
}

/* Reset support group */
function resetSup(side){
  var s=SCREENS[ci];
  var n=(side==='left')?s.L:s.R;
  if(side==='left') slc=new Array(n).fill(false);
  else src=new Array(n).fill(false);
  for(var i=0;i<n;i++){
    var b=document.getElementById((side==='left')?'slb'+i:'srb'+i);
    if(b) b.classList.remove('bc');
  }
  var el=document.getElementById((side==='left')?'slcs':'srcs');
  if(el) el.textContent='Tap to count';
  speak('Count again.');
}

/* Select answer */
function selAns(side){
  if(fbState==='ok') return; /* locked after correct */
  sel=side;
  /* Clear incorrect feedback when student makes new selection */
  if(fbState==='no'){
    fbState=null;
    var fbEl=document.getElementById('fbk');
    if(fbEl){fbEl.className='fbk'; fbEl.textContent='';}
  }
  document.getElementById('ansl').classList.toggle('sel',side==='left');
  document.getElementById('ansr').classList.toggle('sel',side==='right');
  document.getElementById('btn-chk').disabled=false;
  var s=SCREENS[ci];
  speak(String(side==='left'?s.L:s.R));
}

/* Check answer */
function chkAns(){
  if(!sel) return;
  var s=SCREENS[ci];
  var correct=(sel===s.side);
  var fbEl=document.getElementById('fbk');
  fbState=correct?'ok':'no';

  if(correct){
    fbEl.className='fbk fbk-ok show';
    var nextBtn=(ci<SCREENS.length-1)?
      '<br><button class="btn-next-fb" onclick="navNext()">Next \u2192</button>':'';
    fbEl.innerHTML=s.ok+nextBtn;
    document.getElementById('btn-chk').disabled=true;
    /* Highlight correct button in green */
    var correctBtn=document.getElementById(s.side==='left'?'ansl':'ansr');
    if(correctBtn) correctBtn.style.cssText='border-color:#27AE60;background:#D5F5E3';
    speak(s.ok);
  } else {
    fbEl.className='fbk fbk-no show';
    fbEl.textContent=s.no;
    /* Clear selection for retry — do NOT reveal the answer */
    sel=null;
    document.getElementById('ansl').classList.remove('sel');
    document.getElementById('ansr').classList.remove('sel');
    document.getElementById('btn-chk').disabled=true;
    speak(s.no);
  }
}

/* Toggle show-objects support panel */
function toggleSup(){
  opv=!opv;
  var panel=document.getElementById('sup-panel');
  var btn=document.getElementById('btn-so');
  if(panel) panel.style.display=opv?'block':'none';
  if(btn) btn.textContent=opv?'\u274C Hide Objects':'\uD83D\uDC40 Show Objects';
}

/* ══════════════════════════════════════════════════════════
   9. TRANSITION
══════════════════════════════════════════════════════════ */
function rTrans(s){
  return '<div class="card"><div class="ctr">'+
    '<div style="font-size:80px;margin-bottom:14px">'+s.emoji+'</div>'+
    '<div style="font-size:30px;font-weight:900;color:#1A5276;margin-bottom:10px">'+s.msg+'</div>'+
    (s.sub?'<div style="font-size:20px;color:#5D6D7E;font-weight:600;margin-bottom:20px">'+s.sub+'</div>':'')+
    '<br><button class="btn-start" style="font-size:20px;padding:16px 40px" onclick="navNext()">Continue \u2192</button>'+
    '</div></div>';
}

/* ══════════════════════════════════════════════════════════
   10. END
══════════════════════════════════════════════════════════ */
function rEnd(){
  return '<div class="card"><div class="ctr">'+
    '<div style="font-size:88px;margin-bottom:16px">\uD83C\uDFC6</div>'+
    '<div style="font-size:36px;font-weight:900;color:#145A32;margin-bottom:10px">Well done!</div>'+
    '<div style="font-size:22px;color:#5D6D7E;font-weight:600;margin-bottom:30px">You can compare numbers!</div>'+
    '<button class="btn-restart" onclick="navHome()">\uD83C\uDFE0 Start Again</button>'+
    '</div></div>';
}

/* ══════════════════════════════════════════════════════════
   11. INITIALISE
══════════════════════════════════════════════════════════ */
render();
</script>
